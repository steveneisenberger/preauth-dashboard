<style>
/* Same look as the Automation Status page. Light theme only.

:root {

  --hp:#2459b8;  --hp-soft:#e5edfa;   /* Hanson Place */
  --wal:#1d7a4f; --wal-soft:#e2f2e9;  /* Wallabout */
  --bp:#b4530b;  --bp-soft:#fcecdc;   /* Boro Park */
  --eto:#7a3fb0; --eto-soft:#f1e8f9;  /* ETO */

.o-hp  { --oc:var(--hp);  --os:var(--hp-soft) }
.o-wal { --oc:var(--wal); --os:var(--wal-soft) }
.o-bp  { --oc:var(--bp);  --os:var(--bp-soft) }
.o-eto { --oc:var(--eto); --os:var(--eto-soft) }
.dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--oc); flex:none }
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif }
button,select,input { font:inherit; color:inherit }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px }
.banner { font-size:13px; padding:8px max(16px,env(safe-area-inset-left,0px)); text-align:center }
.banner.test { background:var(--warn-soft); color:var(--warn-text) }
.banner.err { background:var(--bad-soft); color:var(--bad-text) }
main { max-width:1040px; margin:0 auto; padding-block:24px 48px;

.john { max-width:640px; margin:0 auto }
h1 { font-size:22px; margin:0; letter-spacing:-.01em; text-wrap:balance }
h2 { font-size:16px; margin:0 }
.sub { margin:4px 0 20px; color:var(--ink2) }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; min-width:0 }

.body { flex:1; min-width:0 }

footer { color:var(--ink2); font-size:13px; margin-top:16px }

.cols > * { min-width:0 }
.stack { display:grid; gap:12px; min-width:0 }
.hint { color:var(--ink2); font-size:13px; margin:2px 0 0 }

.office .tablewrap { margin-top:0 }

select,input[type=text] { width:100%; min-width:0; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); font-size:15px }
.btn { border:0; border-radius:8px; padding:9px 14px; font-weight:600; cursor:pointer; background:var(--accent); color:var(--accent-ink) }
.btn:disabled { background:var(--soft); color:var(--ink2); cursor:not-allowed }
.add { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; justify-content:space-between; margin-top:12px; font-size:14px }
.icon { width:32px; height:32px; border:1px solid var(--line); background:var(--card); border-radius:8px; cursor:pointer; font-size:14px; line-height:1; flex:none }
.icon:disabled { opacity:.35; cursor:default }
.ctrls { display:flex; gap:4px; flex:none }
input.noteedit { margin-top:6px; padding:5px 8px; font-size:13px }
.tablewrap { overflow-x:auto; margin-top:10px }
table { width:100%; border-collapse:collapse; font-size:14px }
th { text-align:left; color:var(--ink2); font-weight:600; font-size:13px; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap }
td { padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap }
tr:last-child td { border-bottom:0 }
th.n,td.n { text-align:right; font-variant-numeric:tabular-nums }
td.zero { color:var(--ink2) }
tr.group td { background:var(--soft); font-weight:600; font-size:13px; color:var(--ink2) }
tr.ready td { font-weight:600 }
.head { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; align-items:center }
.filters { display:flex; flex-wrap:wrap; gap:8px }
.filters select { width:auto; max-width:100% }
.saved { font-size:13px; color:var(--ink2) }
.saved.err { color:var(--bad-text); font-weight:600 }
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:8px; font-size:14px; max-width:calc(100% - 32px) }
@media (max-width:760px) {
  .cols { grid-template-columns:minmax(0,1fr) }
}
</style>

}
var API = "https://api.github.com/repos/" + D.repo + "/contents/queue.json";
function headers() { var h = { Accept: "application/vnd.github+json" }; if (ADMIN && D.token) h.Authorization = "Bearer " + D.token; return h; }
function loadList() {
  if (TEST) {
    var s = null; try { s = localStorage.getItem("mcq-test-list"); } catch (e) {}
    list = clean(s ? JSON.parse(s) : []); loaded = true; return Promise.resolve();
  }
  return fetch(API + "?t=" + Date.now(), { headers: headers(), cache: "no-store" }).then(function (r) {
    if (r.status === 404) { list = []; sha = null; loaded = true; return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json().then(function (j) { sha = j.sha; return open_(atob(j.content.replace(/\s/g, ""))); })
      .then(function (items) { list = clean(items); loaded = true; });
  });
}
function saveList(msg) {
  if (!ADMIN) return;
  if (broken) { saveState = "Not saved: John's list didn't load. Reload the page."; paintSaved(true); return; }
  saveState = "Saving..."; paintSaved();
  if (TEST) { try { localStorage.setItem("mcq-test-list", JSON.stringify(list)); } catch (e) {} saveState = "Saved (this browser only)"; paintSaved(); toast(msg); return; }
  seal(list).then(function (body) {
    return fetch(API, { method: "PUT", headers: headers(), body: JSON.stringify({ message: "Update John's list", content: utf8b64(body), sha: sha || undefined }) });
  }).then(function (r) {
    if (r.status === 409 || r.status === 422) {          // changed in another tab or device
      return loadList().then(function () { render(); throw new Error("The list changed somewhere else. It has been reloaded; make your change again."); });
    }
    if (!r.ok) throw new Error("Could not save (HTTP " + r.status + ")");
    return r.json().then(function (j) { sha = j.content.sha; saveState = "Saved"; paintSaved(); toast(msg); });
  }).catch(function (e) { saveState = e.message || "Could not save"; paintSaved(true); });
}
function paintSaved(err) { var e = document.getElementById("saved"); if (e) { e.textContent = saveState; e.className = "saved" + (err ? " err" : ""); } }

// ---------- John ----------
function johnView() {
  var live = list.filter(function (t) { return sum(t, "ready") > 0; });
  var h = '<div class="john"><h1>Your MC submissions</h1>';
  if (!live.length) return h + '<p class="sub">Counts from ' + esc(D.asof) + '.</p><div class="card"><h2>Nothing assigned right now</h2><p class="hint">Steven will add your next task here.</p></div></div>';
  var total = live.reduce(function (a, t) { return a + sum(t, "ready"); }, 0);
  var c = live[0], ready = sum(c, "ready"), done = sum(c, "done"), pct = ready + done ? Math.round(done / (ready + done) * 100) : 0;
  h += '<p class="sub">' + plural(total, "chart") + " on your list. Counts from " + esc(D.asof) + ".</p>";
  h += '<section class="card now ' + oc(c.office) + '"><p class="tag"><span class="dot"></span>Work on this now</p><div class="what"><div class="name">' + esc(c.type) + " " + esc(c.office) + "<small>" + scope(c) + "</small></div>"
    + '<div class="count"><b>' + ready + "</b><span>ready to submit</span></div></div>"
    + '<div class="bar"><i style="width:' + pct + '%"></i></div><div class="barnote"><span>' + done + " submitted " + esc(doneNote()) + "</span><span>" + pct + "% done</span></div>";
  if (c.thru) h += '<p class="note">Only charts with a status date through the end of ' + esc(monthName(c.thru)) + ". Leave newer charts for later." + (noSplit(c) ? " The count above still includes all dates until the next update." : "") + "</p>";
  if (c.note) h += '<p class="note"><b>Steven:</b> ' + esc(c.note) + "</p>";
  h += '<p class="skip">Only submit graded charts. If a chart isn\'t graded, rename its nickname to "no grade" and skip it.</p></section>';
  if (live.length > 1) {
    h += '<section class="card"><h2>Up next</h2><ol class="list">';
    live.slice(1).forEach(function (t, i) {
      h += '<li class="' + oc(t.office) + '"><span class="pos">' + (i + 2) + '</span><div class="body"><div class="t">' + chip(t.type) + esc(t.office) + '</div><div class="m">' + scope(t) + (t.note ? ". " + esc(t.note) : "") + '</div></div><div class="num">' + sum(t, "ready") + "<span>ready</span></div></li>";
    });
    h += "</ol></section>";
  }
  return h + "<footer>Only Steven can change this list. A task leaves it when its count reaches 0. Counts update at 9 AM, 1 PM and 6:30 PM. Counts only, no patient information.</footer></div>";
}

// ---------- Admin ----------
function preauthCard() {
  var rows = D.preauth.filter(function (r) { return r.office === pa.office && (pa.ins === ALL || r.ins === pa.ins); });
  function n(st) { return rows.filter(function (r) { return r.status === st; }).reduce(function (a, r) { return a + r.count; }, 0); }
  var tracks = [["MC", D.statuses.slice(0, 4)], ["PH1-MC", D.statuses.slice(4)]];
  var h = '<section class="card"><div class="head"><h2>Pre-Auth status</h2><div class="filters">'
    + '<select id="pa-office" aria-label="Pre-Auth office">' + opts(D.offices, pa.office) + "</select>"
    + '<select id="pa-ins" aria-label="Pre-Auth insurer">' + opts([ALL].concat(insFor(pa.office)), pa.ins) + "</select></div></div>"
    + '<p class="hint">' + esc(pa.office) + ", " + esc(pa.ins === ALL ? "all insurers" : pa.ins) + ". Counts from " + esc(D.asof) + '. Follows the office and insurer you pick in "Add a task".</p>'
    + '<div class="tablewrap"><table><thead><tr><th>Status</th><th class="n">Charts</th></tr></thead><tbody>';
  tracks.forEach(function (tr) {
    h += '<tr class="group"><td colspan="2">' + esc(tr[0]) + "</td></tr>";
    tr[1].forEach(function (st, i) {
      var v = n(st);
      h += "<tr" + (i === 0 ? ' class="ready"' : "") + "><td>" + esc(st) + (i === 0 ? " (ready for John)" : "") + '</td><td class="n' + (v ? "" : " zero") + '">' + v + "</td></tr>";
    });
  });
  return h + "</tbody></table></div></section>";
}
function adminView() {
  var ready = D.queue.reduce(function (a, r) { return a + r.ready; }, 0), done = D.queue.reduce(function (a, r) { return a + r.done; }, 0);
  var h = '<h1>MC queue admin</h1><p class="sub">' + ready + " ready to submit, " + done + " submitted " + esc(doneNote()) + ". Counts from " + esc(D.asof) + '. <span id="saved" class="saved"></span></p>';
  h += '<div class="cols"><div class="stack"><section class="card"><h2>John\'s list</h2><p class="hint">John works from the top down. Tasks with 0 ready are hidden from him. John\'s page has no password, so anyone with its link can see this list and its notes.</p>';
  if (!list.length) h += '<p class="hint" style="margin-top:12px">The list is empty. Add a task below.</p>';
  h += '<ol class="list">';
  list.forEach(function (t, i) {
    h += '<li class="' + oc(t.office) + '"><span class="pos">' + (i + 1) + '</span><div class="body"><div class="t">' + chip(t.type) + esc(t.office) + '</div><div class="m">' + scope(t) + " · " + sum(t, "ready") + " ready</div>"
      + '<input class="noteedit" type="text" maxlength="300" data-note="' + i + '" aria-label="Note for John on task ' + (i + 1) + '" placeholder="Note for John (public, no patient names)" value="' + esc(t.note) + '"></div>'
      + '<div class="ctrls"><button class="icon" type="button" data-up="' + i + '" aria-label="Move task ' + (i + 1) + ' up"' + (i ? "" : " disabled") + ">↑</button>"
      + '<button class="icon" type="button" data-down="' + i + '" aria-label="Move task ' + (i + 1) + ' down"' + (i < list.length - 1 ? "" : " disabled") + ">↓</button>"
      + '<button class="icon" type="button" data-rm="' + i + '" aria-label="Remove task ' + (i + 1) + '">✕</button></div></li>';
  });
  h += "</ol></section>";
  var dates = [{ v: "", t: "All dates" }].concat(MONTHS.slice().reverse().map(function (m) { return { v: m, t: "Through " + monthName(m) }; }));
  h += '<section class="card"><h2>Add a task</h2><div class="row">'
    + '<label>Office<select id="d-office">' + opts(D.offices, draft.office) + "</select></label>"
    + '<label>Type<select id="d-type">' + opts(["MC", "PH1-MC"], draft.type) + "</select></label>"
    + '<label>Insurer<select id="d-ins">' + opts([ALL].concat(insFor(draft.office)), draft.ins) + "</select></label>"
    + '<label>Chart dates<select id="d-thru"' + (MONTHS.length ? "" : " disabled") + ">" + optsV(dates, draft.thru) + "</select></label>"
    + '<label class="wide">Note for John (optional, public, no patient names)<input type="text" id="d-note" maxlength="300" value="' + esc(draft.note) + '" placeholder="Example: Do Liberty before the portal update"></label></div>'
    + (MONTHS.length ? "" : '<p class="hint" style="margin-top:8px">Date ranges become available after the next Pre-Auth count.</p>')
    + '<div class="add"><span id="d-count"></span><button class="btn" type="button" id="d-add">Add to John\'s list</button></div></section>';
  h += preauthCard() + "</div>";
  h += '<section class="card"><h2>All open work</h2><p class="hint">All dates.</p>';
  D.offices.forEach(function (o) {
    var rows = D.queue.filter(function (r) { return r.office === o; }).sort(function (a, b) { return b.ready - a.ready; });
    if (!rows.length) return;
    var n = rows.reduce(function (a, r) { return a + r.ready; }, 0);
    h += '<div class="office ' + oc(o) + '"><div class="ohead"><span><span class="dot"></span>' + esc(o) + "</span><b>" + n + " ready</b></div>"
      + '<div class="tablewrap"><table><thead><tr><th>Type</th><th>Insurer</th><th class="n">Ready</th><th class="n">Submitted</th><th></th></tr></thead><tbody>';
    rows.forEach(function (r) {
      var on = list.some(function (t) { return covers(t, r); });
      h += "<tr><td>" + chip(r.type) + "</td><td>" + esc(r.ins) + '</td><td class="n' + (r.ready ? "" : " zero") + '">' + r.ready + '</td><td class="n' + (r.done ? "" : " zero") + '">' + r.done + '</td><td class="on">' + (on ? "On list" : "") + "</td></tr>";
    });
    h += "</tbody></table></div></div>";
  });
  return h + "</section></div><footer>Ready = charts in MC or (1) MC PH1, which can include charts not graded yet. Chart dates use the status date in Edge. Submitted = charts that moved on to SUB, APP or denied " + esc(doneNote()) + ", for all dates. Counts come from the Pre-Auth run on Benny-PC (9 AM, 1 PM, 6:30 PM). Counts only, no patient information.</footer>";
}
function updateDraft() {
  var c = document.getElementById("d-count"), b = document.getElementById("d-add"); if (!c) return;
  var n = sum(draft, "ready"), dup = list.some(function (t) { return same(t, draft); });
  c.textContent = dup ? "Already on John's list" : plural(n, "chart") + " ready";
  b.disabled = dup || n === 0;
}
function render() {
  if (!loaded) return;
  app.innerHTML = ADMIN ? adminView() : johnView();
  updateDraft(); paintSaved();
}

// ---------- events (admin only) ----------
if (ADMIN) {
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return; var d = b.dataset, t;
    if (d.up) { t = +d.up; list.splice(t - 1, 0, list.splice(t, 1)[0]); render(); saveList("John's list updated"); }
    else if (d.down) { t = +d.down; list.splice(t + 1, 0, list.splice(t, 1)[0]); render(); saveList("John's list updated"); }
    else if (d.rm) { t = list.splice(+d.rm, 1)[0]; render(); saveList("Removed " + t.type + " " + t.office); }
    else if (b.id === "d-add") { list.push({ type: draft.type, office: draft.office, ins: draft.ins, thru: draft.thru, note: draft.note.trim() }); draft.note = ""; render(); saveList("Added to John's list"); }
  });
  app.addEventListener("change", function (e) {
    var id = e.target.id, v = e.target.value;
    if (id === "d-type") draft.type = v;
    if (id === "d-office") { draft.office = pa.office = v; if (draft.ins !== ALL && insFor(v).indexOf(draft.ins) < 0) draft.ins = ALL; pa.ins = draft.ins; render(); }
    if (id === "d-ins") { draft.ins = pa.ins = v; render(); }
    if (id === "pa-office") { pa.office = v; if (pa.ins !== ALL && insFor(v).indexOf(pa.ins) < 0) pa.ins = ALL; render(); }
    if (id === "pa-ins") { pa.ins = v; render(); }
    if (id === "d-thru") draft.thru = MONTH_RE.test(v) ? v : "";
    if (e.target.dataset.note !== undefined) { list[+e.target.dataset.note].note = v.trim(); saveList("Note saved"); }
    updateDraft();
  });
  app.addEventListener("input", function (e) { if (e.target.id === "d-note") draft.note = e.target.value; });
}

// ---------- start ----------
if (TEST) banner("test", "Test copy with made-up numbers. The list is saved in this browser only.");
loadList().then(render).catch(function () {
  broken = loaded = true; render();
  banner("err", ADMIN ? "Could not load John's list. Reload the page before making changes." : "Could not load your list. Try reloading the page.");
});
if (!ADMIN) setTimeout(function () { location.reload(); }, 15 * 60 * 1000);   // new counts and list changes
})();
</script>
</body>
</html>
